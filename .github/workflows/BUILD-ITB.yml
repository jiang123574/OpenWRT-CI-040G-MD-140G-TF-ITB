# 手动编译：Nokia XG-040G-MD(UBI) + XG-140G-TF(UBI) 的 sysupgrade.itb
# 源码 bingoguo93/immortalwrt @ 6.18 + AIROHA-MAIN；一次编译同时产出两款机型的 .itb + recovery.itb
name: BUILD-ITB-040G-MD-140G-TF

on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用换行分隔（可留空）'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件'
        default: false
        required: false
        type: boolean

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  config:
    name: AIROHA-MAIN (040G-MD + 140G-TF)
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: AIROHA-MAIN
      WRT_THEME: argon
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: "12345678"
      WRT_IP: 192.168.1.1
      WRT_PW: 无
      WRT_REPO: https://github.com/bingoguo93/immortalwrt.git
      WRT_BRANCH: 6.18
      WRT_SOURCE: bingoguo93/immortalwrt
      WRT_PACKAGE: ${{ inputs.PACKAGE || '' }}
      WRT_TEST: ${{ inputs.TEST == true }}
